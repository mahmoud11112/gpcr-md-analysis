[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpcr-md-analysis"
version = "0.1.0"
description = "RMSD, RMSF and hydrogen bond analysis of membrane-protein MD trajectories"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
dependencies = ["MDAnalysis>=2.7", "numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[project.scripts]
mdtools = "mdtools.cli:main"

[tool.setuptools]
packages = ["mdtools"]
